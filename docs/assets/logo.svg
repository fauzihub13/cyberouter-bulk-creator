<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="cyberouter-bulk-creator logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#1e2a4d" stroke-width="2"/>

  <!-- Router: central node -->
  <circle cx="256" cy="256" r="46" fill="none" stroke="url(#stroke)" stroke-width="14" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="18" fill="url(#glow)"/>

  <!-- Spokes / distributed nodes -->
  <g stroke="url(#stroke)" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="256" y1="210" x2="256" y2="120"/>
    <line x1="296" y1="232" x2="380" y2="170"/>
    <line x1="300" y1="276" x2="390" y2="300"/>
    <line x1="256" y1="302" x2="256" y2="392"/>
    <line x1="216" y1="278" x2="122" y2="300"/>
    <line x1="216" y1="232" x2="132" y2="172"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#0b1020" stroke="url(#stroke)" stroke-width="12">
    <circle cx="256" cy="110" r="22"/>
    <circle cx="390" cy="164" r="22"/>
    <circle cx="400" cy="306" r="22"/>
    <circle cx="256" cy="402" r="22"/>
    <circle cx="112" cy="306" r="22"/>
    <circle cx="122" cy="164" r="22"/>
  </g>

  <!-- Accent code tick -->
  <g transform="translate(330 330)">
    <circle cx="0" cy="0" r="40" fill="url(#bg)" stroke="url(#stroke)" stroke-width="8"/>
    <path d="M -16 0 L -5 12 L 18 -12" fill="none" stroke="#38e1ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
